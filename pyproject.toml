[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iaclineage"
version = "0.1.0b3"
description = "Local Terraform source explorer"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Mayur Mahajan"}]
keywords = ["terraform", "lineage", "static-analysis", "infrastructure-as-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dependencies = [
  "tree-sitter==0.26.0",
  "tree-sitter-hcl==1.2.0",
  "pyyaml==6.0.3",
]

[project.urls]
Homepage = "https://github.com/mayurmhjn/iaclineage"
Repository = "https://github.com/mayurmhjn/iaclineage"
Issues = "https://github.com/mayurmhjn/iaclineage/issues"
Changelog = "https://github.com/mayurmhjn/iaclineage/blob/main/CHANGELOG.md"
Security = "https://github.com/mayurmhjn/iaclineage/security/policy"

[project.scripts]
iaclineage = "iaclineage.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iaclineage = ["ui/*.html", "ui/*.css", "ui/*.js"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
