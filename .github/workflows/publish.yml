name: Publish Python package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require a release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          [[ "$RELEASE_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]
  compatibility:
    needs: validate-ref
    uses: ./.github/workflows/compatibility.yml
  build:
    name: Build and validate release distributions
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
      - name: Verify tag and both version declarations
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project python - <<'PY'
          import ast, os, pathlib, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          module = ast.parse(pathlib.Path('src/iaclineage/__init__.py').read_text())
          version = next(ast.literal_eval(n.value) for n in module.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets))
          assert os.environ['RELEASE_TAG'] == 'v' + project['version']
          assert version == project['version']
          PY
      - run: uv build --out-dir dist
      - run: uvx twine check --strict dist/*
      - name: Check installed release wheel
        run: |
          (cd dist && sha256sum *.whl > SHA256SUMS)
          uv run --no-project python scripts/test_wheel.py --wheel-dir dist
          rm dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/iaclineage
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          print-hash: true
  smoke-testpypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
      - name: Install from TestPyPI and exercise CLI
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv venv /tmp/iaclineage-smoke
          uv pip install --python /tmp/iaclineage-smoke/bin/python --index-url https://pypi.org/simple 'tree-sitter==0.26.0' 'tree-sitter-hcl==1.2.0' 'pyyaml==6.0.3'
          for attempt in 1 2 3 4 5; do
            uv pip install --python /tmp/iaclineage-smoke/bin/python --index-url https://test.pypi.org/simple --no-deps "iaclineage==${RELEASE_TAG#v}" && break
            sleep 15
          done
          /tmp/iaclineage-smoke/bin/iaclineage --version
          /tmp/iaclineage-smoke/bin/iaclineage scan tests/fixtures/references
          /tmp/iaclineage-smoke/bin/iaclineage report tests/fixtures/references --format interactive-html --output /tmp/lineage.html
          test -s /tmp/lineage.html
  publish-pypi:
    name: Approve and promote the same distributions to PyPI
    needs: smoke-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/iaclineage
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
